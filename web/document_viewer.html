<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Material de Apoyo — Profitivo</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #060B14;
      --bg-card: #0B1322;
      --green-neon: #00E676;
      --gold-prestige: #FFD700;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --text-muted: #8899A6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-dark);
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    header {
      background: rgba(11, 19, 34, 0.95);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--green-neon);
    }
    .doc-info {
      display: flex;
      flex-direction: column;
    }
    .doc-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      max-width: 500px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-protected {
      font-size: 0.72rem;
      color: var(--green-neon);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-close {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border-subtle);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-close:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #fff;
    }
    .viewer-container {
      flex: 1;
      position: relative;
      background: #0B1322;
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #FFFFFF;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #060B14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: var(--text-muted);
      gap: 14px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 230, 118, 0.2);
      border-top-color: var(--green-neon);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="logo.png" alt="Profitivo">
      <div class="doc-info">
        <span class="doc-title" id="display-doc-title">Material de Apoyo</span>
        <span class="badge-protected">🔒 Visualización Protegida en Línea (Solo Lectura)</span>
      </div>
    </div>
    <div class="actions">
      <button class="btn-close" onclick="window.close();">✖ Cerrar Visor</button>
    </div>
  </header>

  <div class="viewer-container">
    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      <p style="font-size: 0.95rem; color: #fff;">Cargando documento en el explorador...</p>
      <small style="color: var(--text-muted);">Optimizando presentación para visualización sin descarga</small>
    </div>
    <iframe id="doc-iframe" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
  </div>

  <script>
    // Protección contra descargas directas en navegador
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      // Bloquear Ctrl+S (guardar), Ctrl+P (imprimir), F12
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'S' || e.key === 'P')) {
        e.preventDefault();
        return false;
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('url');
    const docTitle = urlParams.get('title') || 'Material de Apoyo del Curso';

    document.getElementById('display-doc-title').textContent = docTitle;
    document.title = `${docTitle} — Visor Profitivo`;

    const iframe = document.getElementById('doc-iframe');
    const loading = document.getElementById('loading');

    if (!targetUrl) {
      loading.innerHTML = '<p style="color: #ff5252;">No se proporcionó una URL de documento válida.</p>';
    } else {
      const lower = targetUrl.toLowerCase();
      let viewerUrl = '';

      if (lower.endsWith('.pdf')) {
        // Para PDF: Usar proxy inline con visor interno protegido, y Google Docs Viewer como respaldo
        viewerUrl = `/api/view-doc?url=${encodeURIComponent(targetUrl)}#toolbar=0&navpanes=0&scrollbar=1`;
      } else if (lower.endsWith('.ppt') || lower.endsWith('.pptx')) {
        // Para PowerPoint: Visor oficial de Microsoft Office Web Viewer (o Google Docs)
        viewerUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(targetUrl)}`;
      } else {
        // Otros formatos: Google Docs Viewer
        viewerUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(targetUrl)}&embedded=true`;
      }

      iframe.src = viewerUrl;

      // Ocultar pantalla de carga cuando el iframe responde
      iframe.onload = () => {
        setTimeout(() => {
          loading.style.display = 'none';
        }, 600);
      };

      // Timeout de seguridad: Si el visor oficial tarda, usar fallback Google Docs Viewer
      setTimeout(() => {
        if (loading.style.display !== 'none') {
          if (!iframe.src.includes('docs.google.com')) {
            console.log("Activando fallback Google Docs Viewer...");
            iframe.src = `https://docs.google.com/viewer?url=${encodeURIComponent(targetUrl)}&embedded=true`;
          } else {
            loading.style.display = 'none';
          }
        }
      }, 5000);
    }
  </script>
</body>
</html>
