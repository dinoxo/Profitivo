<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Material de Apoyo — Profitivo</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- PDF.js para renderizado nativo HTML5 en Canvas (Sin descargas y compatible con todos los navegadores) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg-dark: #060B14;
      --bg-card: #0B1322;
      --green-neon: #00E676;
      --gold-prestige: #FFD700;
      --border-subtle: rgba(255, 255, 255, 0.12);
      --text-muted: #8899A6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-dark);
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    header {
      background: rgba(11, 19, 34, 0.98);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 100;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--green-neon);
    }
    .doc-info {
      display: flex;
      flex-direction: column;
    }
    .doc-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      max-width: 380px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-protected {
      font-size: 0.7rem;
      color: var(--green-neon);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .btn-ctrl:hover {
      background: rgba(0, 230, 118, 0.15);
      border-color: var(--green-neon);
      color: var(--green-neon);
    }
    .page-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      padding: 0 4px;
    }
    .viewer-area {
      flex: 1;
      position: relative;
      background: #0B1322;
      width: 100%;
      height: calc(100vh - 60px);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 10px;
    }
    /* Contenedor de páginas PDF en Canvas */
    #pdf-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }
    .pdf-page-canvas {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      background: #FFFFFF;
      max-width: 95vw;
      height: auto;
      display: block;
    }
    /* Contenedor Iframe para PowerPoint / Office */
    #iframe-container {
      width: 100%;
      height: 100%;
      display: none;
    }
    #doc-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #FFFFFF;
    }
    .loading-state {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #060B14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: var(--text-muted);
      gap: 14px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 230, 118, 0.2);
      border-top-color: var(--green-neon);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="logo.png" alt="Profitivo">
      <div class="doc-info">
        <span class="doc-title" id="display-doc-title">Material de Apoyo</span>
        <span class="badge-protected">🔒 Visualización Protegida en Línea</span>
      </div>
    </div>

    <!-- Controles para PDF (Zoom y Paginación) -->
    <div class="controls" id="pdf-controls" style="display: none;">
      <button class="btn-ctrl" onclick="zoomPdf(-0.2)" title="Reducir Zoom">🔍 -</button>
      <span id="zoom-level" style="font-size: 0.8rem; color: #fff; min-width: 40px; text-align: center;">100%</span>
      <button class="btn-ctrl" onclick="zoomPdf(0.2)" title="Aumentar Zoom">🔍 +</button>
      <span class="page-info" id="page-count-display">Cargando páginas...</span>
    </div>

    <!-- Controles para PowerPoint / Office -->
    <div class="controls" id="office-controls" style="display: none;">
      <button class="btn-ctrl" onclick="toggleOfficeViewer()" title="Cambiar motor de visor">🔄 Cambiar Servidor Visor</button>
    </div>

    <div class="controls">
      <button class="btn-ctrl" onclick="window.close()" style="background: rgba(255, 255, 255, 0.12);">✖ Cerrar</button>
    </div>
  </header>

  <div class="viewer-area" id="viewer-area">
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p style="font-size: 1rem; color: #fff; font-weight: 600;">Abriendo material en el explorador...</p>
      <small style="color: var(--text-muted);">Procesando contenido en alta resolución</small>
    </div>

    <!-- Renderizado nativo en Canvas para PDF -->
    <div id="pdf-container"></div>

    <!-- Iframe directo para presentaciones PowerPoint (.ppt, .pptx) -->
    <div id="iframe-container">
      <iframe id="doc-iframe"></iframe>
    </div>
  </div>

  <script>
    // 1. Protección estricta: bloquear menú contextual y atajos de descarga
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'S' || e.key === 'P')) {
        e.preventDefault();
        return false;
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('url');
    const docTitle = urlParams.get('title') || 'Material de Apoyo del Curso';

    document.getElementById('display-doc-title').textContent = docTitle;
    document.title = `${docTitle} — Visor Profitivo`;

    const loading = document.getElementById('loading');
    const pdfContainer = document.getElementById('pdf-container');
    const iframeContainer = document.getElementById('iframe-container');
    const docIframe = document.getElementById('doc-iframe');
    const pdfControls = document.getElementById('pdf-controls');
    const officeControls = document.getElementById('office-controls');

    let currentScale = 1.25;
    let loadedPdfDoc = null;
    let isOfficeGoogle = false;

    if (!targetUrl) {
      loading.innerHTML = '<p style="color: #ff5252; font-weight: bold;">No se proporcionó una URL de documento válida.</p>';
    } else {
      const lower = targetUrl.toLowerCase();
      const isPdf = lower.includes('.pdf');
      const isPpt = lower.includes('.ppt') || lower.includes('.pptx');

      if (isPdf) {
        initPdfViewer(targetUrl);
      } else {
        initOfficeViewer(targetUrl);
      }
    }

    // -------------------------------------------------------------
    // RENDERIZADO NATIVO HTML5 PARA ARCHIVOS PDF (PDF.JS)
    // -------------------------------------------------------------
    async function initPdfViewer(url) {
      pdfControls.style.display = 'flex';
      pdfContainer.style.display = 'flex';
      iframeContainer.style.display = 'none';

      // Configurar worker oficial de PDF.js
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      const streamUrl = `/api/view-doc?url=${encodeURIComponent(url)}`;

      try {
        const loadingTask = window.pdfjsLib.getDocument({
          url: streamUrl,
          cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
          cMapPacked: true
        });

        loadedPdfDoc = await loadingTask.promise;
        document.getElementById('page-count-display').textContent = `${loadedPdfDoc.numPages} pág(s)`;
        
        loading.style.display = 'none';
        await renderAllPdfPages();
      } catch (err) {
        console.warn("Fallo visor nativo PDF.js, intentando visor secundario:", err);
        // Fallback a visor en iframe
        initOfficeViewer(url);
      }
    }

    async function renderAllPdfPages() {
      if (!loadedPdfDoc) return;
      pdfContainer.innerHTML = '';

      for (let num = 1; num <= loadedPdfDoc.numPages; num++) {
        const page = await loadedPdfDoc.getPage(num);
        const viewport = page.getViewport({ scale: currentScale });

        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page-canvas';
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        pdfContainer.appendChild(canvas);

        const renderContext = {
          canvasContext: context,
          viewport: viewport
        };
        await page.render(renderContext).promise;
      }
    }

    function zoomPdf(delta) {
      if (!loadedPdfDoc) return;
      currentScale = Math.max(0.6, Math.min(2.5, currentScale + delta));
      document.getElementById('zoom-level').textContent = `${Math.round(currentScale / 1.25 * 100)}%`;
      renderAllPdfPages();
    }

    // -------------------------------------------------------------
    // VISOR WEB EN LÍNEA PARA POWERPOINT / PRESENTACIONES
    // -------------------------------------------------------------
    function initOfficeViewer(url) {
      officeControls.style.display = 'flex';
      pdfControls.style.display = 'none';
      pdfContainer.style.display = 'none';
      iframeContainer.style.display = 'block';

      // Usar Google Docs Viewer o Microsoft Office Viewer
      isOfficeGoogle = true;
      docIframe.src = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;

      docIframe.onload = () => {
        setTimeout(() => {
          loading.style.display = 'none';
        }, 500);
      };

      // Si tarda en cargar Google Docs Viewer, cambiar a Microsoft Office Web Viewer
      setTimeout(() => {
        if (loading.style.display !== 'none') {
          docIframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
          loading.style.display = 'none';
        }
      }, 4000);
    }

    function toggleOfficeViewer() {
      if (!targetUrl) return;
      loading.style.display = 'flex';
      isOfficeGoogle = !isOfficeGoogle;
      if (isOfficeGoogle) {
        docIframe.src = `https://docs.google.com/viewer?url=${encodeURIComponent(targetUrl)}&embedded=true`;
      } else {
        docIframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(targetUrl)}`;
      }
      docIframe.onload = () => {
        setTimeout(() => {
          loading.style.display = 'none';
        }, 500);
      };
    }
  </script>
</body>
</html>
